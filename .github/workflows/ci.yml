name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Beans
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The 0.1.28 installer unpacks the Windows .zip with tar -xz,
            # which Git Bash's GNU tar refuses; fetch and unzip directly
            # until a release ships the installer fix.
            url=$(gh api repos/beans-lang/beans/releases/latest \
              -q '.assets[] | select(.name | endswith("x86_64-pc-windows-gnullvm.zip")) | .browser_download_url')
            curl -fsSL -o /tmp/beans.zip "$url"
            unzip -q /tmp/beans.zip -d "$HOME/beans-dist"
            echo "$HOME"/beans-dist/*/bin >> "$GITHUB_PATH"
          else
            curl -fsSL https://github.com/beans-lang/beans/releases/latest/download/beans-install.sh | sh
            echo "$HOME/.beans/bin" >> "$GITHUB_PATH"
          fi

      - name: Toolchain versions
        run: |
          beansc --version
          clang --version | head -1

      - name: Vendor integrity
        run: |
          printf '%s  vendor/sqlite3.c\n%s  vendor/sqlite3.h\n' \
            b1dd5d74ec7f29055a6684fa06fb3c2f6821c87dd38f9a458dfd2e8a1db28189 \
            919e7f2e8ed1d8f56ac17b412b8971c76aa5d1a879752cc6058f75e7d5910e1d \
            | shasum -a 256 -c -

      - name: Test (interpreter, target checks, native)
        run: ./test.sh --native
